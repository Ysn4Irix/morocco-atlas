services:
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    image: morocco-directory-web:latest
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NEXT_TELEMETRY_DISABLED=1
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1024M
        reservations:
          cpus: "0.2"
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - dokploy-network
    # Optional Traefik labels: Uncomment if configuring routing manually via Compose instead of Dokploy Domains UI
    # labels:
    #   - "traefik.enable=true"
    #   - "traefik.http.routers.morocco-atlas.rule=Host(`${DOMAIN:-localhost}`)"
    #   - "traefik.http.routers.morocco-atlas.entrypoints=websecure"
    #   - "traefik.http.routers.morocco-atlas.tls.certResolver=letsencrypt"
    #   - "traefik.http.services.morocco-atlas.loadbalancer.server.port=3000"

networks:
  dokploy-network:
    external: true
